<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover：让页面铺满刘海屏，再用 safe-area 留白 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1A16" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>SongNest</title>
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 页面内容由 js/views/ 下的文件渲染到这里 -->
  <main id="view" class="view"></main>

  <!-- 底部固定区域：播放条 + 标签栏，所有页面共用 -->
  <footer class="dock">
    <div id="player-bar" class="player-bar"></div>
    <nav class="tab-bar" aria-label="主导航">
      <a href="#/library" class="tab" data-tab="library"></a>
      <a href="#/playlists" class="tab" data-tab="playlists"></a>
    </nav>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
