<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover：让页面铺满刘海屏，再用 safe-area 留白 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1A16" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>SongNest</title>

  <!-- PWA：添加到主屏幕后像一个独立的应用 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <!-- iOS 不读 manifest 里的图标和名字，要单独写 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="SongNest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 透明状态栏：页面铺到屏幕最顶上（时间、电量浮在页面上面），全屏播放页的渐变才能一直延伸到顶 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 页面内容由 js/views/ 下的文件渲染到这里 -->
  <main id="view" class="view"></main>

  <!-- 底部固定区域：播放条 + 标签栏，所有页面共用 -->
  <footer class="dock">
    <div id="player-bar" class="player-bar"></div>
    <nav class="tab-bar" aria-label="主导航">
      <a href="#/library" class="tab" data-tab="library"></a>
      <a href="#/playlists" class="tab" data-tab="playlists"></a>
      <a href="#/more" class="tab" data-tab="more"></a>
    </nav>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 状态栏透明时，挡住滚到时间、电量下面的列表内容 -->
  <div class="safe-top" aria-hidden="true"></div>
</body>
</html>
